<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="The Daily Three tear-off to-do pad">
  <g fill="none" stroke="#2A141A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

    <g transform="rotate(-5 300 300)">
      <!-- sheets beneath -->
      <rect x="166" y="112" width="292" height="386" rx="5" fill="#E5CBC4" stroke="#D3B3AB"/>
      <rect x="160" y="106" width="292" height="386" rx="5" fill="#F5E3DD" stroke="#D3B3AB"/>

      <!-- top sheet -->
      <rect x="152" y="98" width="292" height="386" rx="5" fill="#FCF5F2"/>

      <!-- header band + rule -->
      <path d="M152 158h292" stroke="#E0C6BF"/>
      <path d="M182 132h74" stroke="#2A141A" stroke-width="7"/>
      <circle cx="410" cy="130" r="9" stroke="#7E2B37" stroke-width="2.5"/>

      <!-- task 1 — done -->
      <rect x="182" y="204" width="27" height="27" rx="3" fill="#7E2B37" stroke="#7E2B37"/>
      <path d="m188.5 217.5 5.5 5.5 10-11" stroke="#FCF5F2" stroke-width="3.2"/>
      <path d="M230 217h150" stroke="#D9BCB6" stroke-width="6"/>
      <path d="M226 217h158" stroke="#7C565C" stroke-width="1.6"/>

      <!-- task 2 — done -->
      <rect x="182" y="278" width="27" height="27" rx="3" fill="#7E2B37" stroke="#7E2B37"/>
      <path d="m188.5 291.5 5.5 5.5 10-11" stroke="#FCF5F2" stroke-width="3.2"/>
      <path d="M230 291h116" stroke="#D9BCB6" stroke-width="6"/>
      <path d="M226 291h124" stroke="#7C565C" stroke-width="1.6"/>

      <!-- task 3 — open -->
      <rect x="182" y="352" width="27" height="27" rx="3" fill="#FCF5F2"/>
      <path d="M230 365h136" stroke="#5A3A3F" stroke-width="6"/>

      <!-- footer rule -->
      <path d="M182 434h140" stroke="#E0C6BF" stroke-width="2"/>

      <!-- wire-o binding -->
      <g stroke="#2A141A" stroke-width="4">
        <path d="M186 90v22M232 90v22M278 90v22M324 90v22M370 90v22M416 90v22"/>
      </g>
      <g fill="#FCF5F2" stroke="#2A141A" stroke-width="3">
        <ellipse cx="186" cy="88" rx="9" ry="7"/><ellipse cx="232" cy="88" rx="9" ry="7"/>
        <ellipse cx="278" cy="88" rx="9" ry="7"/><ellipse cx="324" cy="88" rx="9" ry="7"/>
        <ellipse cx="370" cy="88" rx="9" ry="7"/><ellipse cx="416" cy="88" rx="9" ry="7"/>
      </g>
    </g>

    <!-- pencil -->
    <g transform="rotate(24 470 380)">
      <path d="M462 250h30v206l-15 26-15-26V250Z" fill="#F5E3DD"/>
      <path d="M462 250h30v30h-30z" fill="#7E2B37" stroke="#7E2B37"/>
      <path d="M462 430h30" stroke="#2A141A" stroke-width="2.5"/>
      <path d="m470 452 7-12 7 12" fill="#2A141A"/>
    </g>

  </g>
</svg>
